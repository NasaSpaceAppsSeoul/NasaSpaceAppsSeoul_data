    if (v > 0) s += `<rect x="${x}" y="${y(v)}" width="${bwi}" height="${y(0) - y(v)}" fill="${c}" rx="1.5"/>`;
    else s += `<rect x="${x}" y="${y(0) - 2}" width="${bwi}" height="2" fill="${css("--line")}"/>`;
    if (labels && labels.top(i, v) !== "") s += `<text x="${x + bwi / 2}" y="${Math.max(11, y(v) - 5)}" text-anchor="middle" class="${labels.strong(i) ? "lbl" : ""}">${labels.top(i, v)}</text>`;
    if (labels && labels.bottom(i) !== "") s += `<text x="${x + bwi / 2}" y="${h - 6}" text-anchor="middle" class="${labels.strong(i) ? "lbl" : ""}">${labels.bottom(i)}</text>`;
  });
  if (line !== undefined) s += `<line x1="${left}" x2="${w}" y1="${y(line)}" y2="${y(line)}" stroke="${css("--ink")}" stroke-dasharray="4 3"/><text x="${w}" y="${y(line) - 4}" text-anchor="end" class="lbl">평년 ${fmt(line)}</text>`;
  return s + "</svg>";
}

function status(r) {
  if (r.suff !== "충분") return null;
  if (r.rank === 1 && r.value > 0) return ["exc", "이례적으로 많음 · 최고 기록"];
  if (r.value > r.q75) return ["warn", "평년보다 많음"];
  if (r.value < r.q25) return ["ok", "평년보다 적음"];
  return ["none", "평년 수준"];
}
const dstat = r => { const v = Object.values(r.daily); return { days: v.filter(x => x > 0).length, peak: v.length ? Math.max(...v) : 0 }; };
const range = r => `${Math.round(r.q25)}~${Math.round(r.q75)}칸`;

function hero(r) {
  const [k, txt] = ST[r.suff], p = r.prov, name = short(r.label), st = status(r), c = r.clusters;
  let verdict;
  if (r.suff === "충분") {
    verdict = `${YEAR}년 ${MONTH} 화재 칸 <b>${fmt(r.value)}개</b>. 같은 달 ${r.n}년 중 <b>${r.rank}위</b>이고, 보통 해의 ${MONTH}(${range(r)})보다 ${r.value > r.q75 ? "많아요" : r.value < r.q25 ? "적어요" : "비슷해요"}.`;
  } else if (r.suff === "부족") {
    verdict = `${YEAR}년 ${MONTH} 화재 칸 <b>${fmt(r.value)}개</b>. 평소 불이 드문 지역이라 평년과의 비교 대신 실제 값과 ${r.ref.name} 전체 흐름을 함께 보여 드려요.`;
  } else {
    verdict = `2012년 이후 위성에 잡힌 불이 없는 지역이에요. 위성으로 보일 만한 규모의 화재 위험은 낮은 편이에요. 주변 지역 상황을 아래에서 확인하세요.`;
  }
  const facts = [
    ["이번 달 화재 칸", fmt(r.value), "칸 = 하루에 불이 잡힌 약 1 km 칸"],
    ["같은 달 순위", r.suff === "충분" ? `${r.rank} / ${r.n}` : null, r.suff === "충분" ? `${r.n}년 중` : "자료가 적어 표시하지 않아요"],
    ["불이 잡힌 날 · 가장 넓게 탄 날", `${dstat(r).days}일 · ${dstat(r).peak}칸`, "얼마나 오래 · 얼마나 넓게"],
    ["평소 연간 화재 칸", fmt(r.annual), `가장 많이 탄 해 제외 · 충분 기준 ${fmt(D.national.min_annual)}`],
  ];
  const q = r.ref, ns = r.fallback && r.fallback.nearest_sufficient;
  const refLine = x => `${x.name} 전체 ${MONTH}: 화재 칸 ${fmt(x.v)}개${x.suff === "충분" && x.v > 0 ? `, ${x.n}년 중 ${x.rank}위${x.ratio ? `, 평년의 ${fmt(x.ratio)}배` : ""}` : ""}`;
  const ctx = r.suff === "충분" ? "" : `<div class="ctx"><span class="chip ${ST[p.suff][0]}">${p.name} ${ST[p.suff][1]}</span>
    <span>${p.suff === "충분" ? refLine(p) : `${p.name}도 자료가 적어 가까운 <b>${q.name}</b> 기준을 함께 보여 드려요. ${refLine(q)}`}</span>
    ${ns ? `<span>· 가까운 자료 충분 지역: ${TOK[ns.region] ? `<button class="linkbtn" data-go="${TOK[ns.region]}">${ko(ns.region_label)}</button>` : ko(ns.region_label)} (${fmt(ns.distance_km)} km)</span>` : ""}</div>`;
  el("hero", `<div class="crumb"><span>${r.province}</span><span>›</span><span>${name}</span><span class="chip ${k}">${txt}</span><span class="chip base">NOAA-20 단위 · 기록 2001~ · 같은 달 비교 2012~</span></div>
    <h1>${name} <small>${YEAR}년 ${MONTH} 화재 인사이트</small></h1>
    ${st ? `<div><span class="chip ${st[0]}" style="font-size:13px;padding:3px 11px">${st[1]}</span></div>` : ""}
    <p class="verdict">${verdict}</p>${ctx}
    <div class="facts">${facts.map(([k2, v, s2]) => `<div class="fact"><div class="k">${k2}</div><div class="v ${v === null ? "off" : ""}">${v === null ? "표시 안 함" : v}</div><div class="s">${s2}</div></div>`).join("")}</div>`);
}

function longterm(r) {
  const lt = r.longterm; if (!lt) return "";
  const q = { "높음": "ok", "보통": "warn", "낮음": "none" }[lt.quality];
  const inEvent = r.value > 0 && r.value / Math.max(lt.fire_cells_2001_2025, 1) > 0.5;
  return `<div class="ctx" style="margin-top:4px"><span class="chip ${q}">25년 장기 · 품질 ${lt.quality}</span>
    <span>${lt.quality === "낮음" && lt.fire_cells_2001_2025 > 0 ? "25년 동안 불이 적어 장기 합계도 오차가 커서 표시하지 않아요." : lt.fire_cells_2001_2025 > 0 ? `2001~2025년 화재 칸 <b>${fmt(Math.round(lt.fire_cells_2001_2025))}개</b> (연평균 ${fmt(lt.annual_avg)}개)${inEvent ? `, 그중 ${YEAR}년 ${MONTH}이 ${fmt(r.value)}개` : ""}` : "2001~2025년 화재 칸 0개"}</span>
    <span class="note" style="flex-basis:100%">2001~2011년은 MODIS 값을 시·군·구별 보정 계수로 환산한 추정값이에요. 25년 합계는 검증 오차가 작아(이 크기 지역 약 5~25%) 보여 드리지만, 한 해·한 달 값은 위성마다 크게 어긋나 위 그래프는 2012년부터예요.</span></div>`;
}

function years(r) {
  if (r.suff === "감지 없음") return el("s-years", head(`${MONTH} 연도별 화재 칸`, "생략") + `<p class="answer">2012년 이후 ${MONTH}에 위성에 잡힌 불이 한 번도 없어 그래프를 생략했어요.</p>` + longterm(r) + design("감지 없음이면 제목만 남기고 이유를 한 줄로. 빈 막대 14개는 보여 주지 않음"), true);
  const v = r.strip.map(d => d.v), max = Math.max(...v, r.q75, 1) * 1.08, me = r.strip.findIndex(d => d.year === YEAR);
  const ok = r.suff === "충분", flat = r.q75 === 0;
  el("s-years", head(`${MONTH} 연도별 화재 칸`, `같은 달 ${r.n}년`) +
    `<p class="answer">${ok && flat ? `보통 해의 ${MONTH}에는 화재 칸이 거의 없어요. 올해 한 번 크게 튀었어요.` : ok ? `<b>보통 해의 ${MONTH}: ${range(r)}</b> (14년 중 가운데 절반). 올해는 ${r.value > r.q75 ? "이보다 많아요" : r.value < r.q25 ? "이보다 적어요" : "이 범위 안이에요"}. ${r.n}년 중 ${MONTH}에 불이 잡힌 해는 ${r.yrs_fire}번이에요.` : `대부분의 해가 0~1칸이라 보통 해의 범위는 그리지 않았어요. ${r.n}년 중 ${MONTH}에 불이 잡힌 해는 ${r.yrs_fire}번이에요.`}</p>` +
    svgBars({ data: v, max, color: i => i === me ? css("--ember") : css("--muted"),
      band: ok && !flat ? [r.q25, r.q75] : null, line: ok && !flat ? r.median : undefined,
      labels: { top: (i, x) => x > 0 ? fmt(x) : "0", bottom: i => (i === 0 || i === me || i % 3 === 0) ? `'${String(r.strip[i].year).slice(2)}` : "", strong: i => i === me } }) +
    `<div class="legend"><span><i class="sw" style="background:${css("--ember")}"></i>${YEAR}년</span>${ok && !flat ? `<span><i class="sw" style="background:${css("--band")}"></i>보통 해의 범위</span><span>- - 평년(가운데 값)</span>` : ""}</div>` +
    longterm(r) +
    design((ok ? "충분: 평년 범위 띠와 중앙값 선을 함께 (평년이 0이면 선 대신 문장으로)" : "부족: 띠와 중앙값을 빼고 막대만. 숫자는 그대로라 거짓이 없음") + " · 25년 장기 합계는 검증을 통과한 크기의 지역만 품질과 함께"));
}

function rank(r) {
  const sorted = [...r.strip].sort((a, b) => b.v - a.v || b.year - a.year);
  if (r.suff === "충분") {
    const top = sorted.slice(0, 5);
    if (!top.some(d => d.year === YEAR)) top.push(sorted.find(d => d.year === YEAR));
    const rk = d => r.strip.filter(x => x.v > d.v).length + 1;
    return el("s-rank", head(`${MONTH} 순위`, `${r.n}년 중`) + `<p class="answer">${YEAR}년이 같은 달 기록 중 ${r.rank}위예요. ${r.rank === 1 ? "2위와의 차이로 얼마나 이례적인지 볼 수 있어요." : `더 많이 탄 해는 ${sorted.filter(d => d.v > r.value).map(d => d.year + "년").join(", ")}이에요.`}</p>
      <div class="scroll"><table><thead><tr><th>순위</th><th>연도</th><th class="n">화재 칸</th></tr></thead><tbody>${top.map(d => `<tr class="${d.year === YEAR ? "me" : ""}"><td>${r.strip.filter(x => x.v === d.v).length > 1 ? "공동 " : ""}${rk(d)}</td><td>${d.year}년</td><td class="n">${fmt(d.v)}</td></tr>`).join("")}</tbody></table></div>` +
      design("값이 0인 해끼리는 '공동'으로 표시. 1위가 0이면 순위를 숨김"));
  }
  if (r.suff === "부족") {
    const hit = r.strip.filter(d => d.v > 0);
    return el("s-rank", head(`${MONTH} 순위`, "순위 대신") + `<p class="answer">자료가 적어 순위는 숨겼어요. 대신 ${MONTH}에 불이 잡힌 해를 모두 보여 드려요: <b>${r.n}년 중 ${hit.length}번</b>.</p>
      <div class="scroll"><table><thead><tr><th>연도</th><th class="n">화재 칸</th></tr></thead><tbody>${hit.sort((a, b) => b.year - a.year).map(d => `<tr class="${d.year === YEAR ? "me" : ""}"><td>${d.year}년</td><td class="n">${fmt(d.v)}</td></tr>`).join("")}</tbody></table></div>` +
      design("부족: 같은 자리에 '불이 잡힌 해 목록'으로 대체"), true);
  }
  el("s-rank", head(`${MONTH} 순위`, "생략") + `<p class="answer">모든 해가 0이라 순위를 매길 수 없어요.</p>` + design("감지 없음: 제목만 남기고 생략"), true);
}

function daily(r) {
  const days = Array.from({ length: 31 }, (_, i) => r.daily[i + 1] || 0), c = r.clusters, mc = r.main_cluster;
  if (!days.some(Boolean)) return el("s-daily", head(`${MONTH} 일별 흐름`, "감지 없음") + `<p class="answer">이번 달 이 지역에서 위성에 잡힌 불이 없어요. 50 km 안에서는 화재 칸 ${r.near50.n}개가 잡혔고, 처음 잡힌 날은 ${MONTH} ${r.near50.first}일이에요.</p>` + design("감지 없음이어도 주변 50 km 감지는 알려 줌. 조기 경보 정보라서"), true);
  const max = Math.max(...days) * 1.12, inMc = i => mc && i + 1 >= +mc.start.slice(8) && i + 1 <= +mc.end.slice(8) && mc.start.slice(0, 7) === r.ym;
  const span = mc ? (mc.regions.length > 1 ? `${mc.regions.map(short).join(" · ")}에 걸쳐` : "이 지역 안에서") : "";
  el("s-daily", head(`${MONTH} 일별 흐름`, "얼마나 오래, 얼마나 넓게") +
    `<div class="facts" style="border-top:0;padding-top:0">
      <div class="fact"><div class="k">불이 잡힌 날</div><div class="v">${dstat(r).days}일</div><div class="s">얼마나 오래</div></div>
      <div class="fact"><div class="k">가장 넓게 탄 날</div><div class="v">${dstat(r).peak}칸</div><div class="s">하루 최대 · 약 ${dstat(r).peak} km² 범위</div></div>
      <div class="fact"><div class="k">감지 묶음</div><div class="v">${c.events}개</div><div class="s">그중 큰 묶음(10칸+) ${c.big_events}개</div></div>
      <div class="fact"><div class="k">50 km 안 첫 감지</div><div class="v">${M}/${r.near50.first}</div><div class="s">주변 경고</div></div></div>
    <p class="answer">${mc ? `가장 큰 감지 묶음은 <b>${+mc.start.slice(5, 7)}/${+mc.start.slice(8)}~${+mc.end.slice(5, 7)}/${+mc.end.slice(8)}</b>, ${span} 화재 칸 ${fmt(mc.cells)}개였어요. 가장 넓게 탄 날은 ${+mc.peak_date.slice(5, 7)}/${+mc.peak_date.slice(8)} (${mc.peak_cells}칸).` : "큰 감지 묶음은 없었어요."}</p>` +
    svgBars({ w: 900, h: 170, data: days, max, color: i => inMc(i) ? css("--ember") : css("--muted"),
      labels: { top: (i, v) => v > 0 ? fmt(v) : "", bottom: i => (i + 1) % 5 === 0 || i === 0 ? `${i + 1}일` : "", strong: () => false } }) +
    `<div class="legend"><span><i class="sw" style="background:${css("--ember")}"></i>가장 큰 감지 묶음 기간</span><span>막대: 그날 이 지역 화재 칸</span></div>` +
    design("'화재 n건'이라고 쓰지 않고 '감지 묶음'으로. 3 km 안·2일 이내로 이어진 화재 칸을 하나로 묶음 (NOAA-20)"));
}

function official(r) {
  const rows = r.official, big = rows.filter(x => x.ha >= 10), dt = D.validation.detect, kb = D.validation.kosis;
  const rate = k => dt[k] ? Math.round(dt[k].detected * 100) + "%" : "—";
  const txt = !rows.length ? `이번 달 이 지역의 공식 산불 기록은 없어요.${r.value > 0 ? " 위성이 잡은 불은 산불 통계에 들어가지 않는 농경지 소각 등일 수 있어요." : ""}`
    : big.length ? `공식 기록 ${rows.length}건 중 10 ha 이상 ${big.length}건이 위성 감지와 같은 시기예요. 가장 큰 불은 ${big.sort((a, b) => b.ha - a.ha)[0].date} ${big[0].place} (${fmt(big[0].ha)} ha).`
    : `공식 기록 ${rows.length}건이 모두 10 ha 미만의 작은 불이에요. 위성은 이런 불을 대부분 못 잡아요.`;
  el("s-official", head("공식 산불 기록과 비교", "산림청") +
    `<p class="answer">${txt}</p>` +
    (rows.length ? `<div class="scroll"><table><thead><tr><th>날짜</th><th>장소</th><th>원인</th><th class="n">피해 면적</th></tr></thead><tbody>${rows.map(x => `<tr class="${x.ha >= 100 ? "me" : ""}"><td>${x.date}</td><td>${x.place}</td><td>${x.cause}</td><td class="n">${fmt(x.ha)} ha</td></tr>`).join("")}</tbody></table></div>` : "") +
    `<p class="note">위성이 공식 산불을 잡는 비율 (2018~2026): 100 ha 이상 ${rate("100 ha 이상")}, 10~100 ha ${rate("10~100")}, 1~10 ha ${rate("1~10")}, 1 ha 미만 약 ${rate("0.1~1")}. 공식 건수로 확인한 2012년 단절: 보정 전 ${kb["원값 이어 붙이기"]?.after_over_before}배 → 보정 후 ${kb["화재 칸 (보정)"]?.after_over_before}배.</p>` +
    design("위성 결과 옆에 공식 기록을 함께 보여 신뢰를 줌. 위성이 작은 산불은 못 본다는 한계도 같은 자리에 적음"), !rows.length && r.value === 0);
}

function season(r) {
  const own = r.own_mt, tot = own.reduce((a, b) => a + b, 0);
  let ref, refName;
  if (r.suff !== "충분") { ref = r.prov_mt; refName = `${r.ref.name} 전체`; }
  const sh = a => { const t = a.reduce((x, y) => x + y, 0); return a.map(x => t ? x / t * 100 : 0); };
  const ownS = sh(own), refS = ref ? sh(ref) : null;
  const w = 460, h = 190, top = 18, bottom = 22, left = 6, bw = (w - left) / 12;
  const max = Math.max(...ownS, ...(refS || [0]), 10) * 1.12, y = v => top + (h - top - bottom) * (1 - v / max);
  let s = `<svg viewBox="0 0 ${w} ${h}" role="img">`;
  r.risk.forEach(m => s += `<rect x="${left + (m - 1) * bw}" y="${top - 8}" width="${bw}" height="${h - top - bottom + 8}" fill="${css("--ember-soft")}"/>`);
  s += `<line x1="${left}" x2="${w}" y1="${y(0)}" y2="${y(0)}" stroke="${css("--line")}"/>`;
  if (tot > 0) ownS.forEach((v, i) => { const x = left + i * bw + bw * .2; s += `<rect x="${x}" y="${y(v)}" width="${bw * .6}" height="${y(0) - y(v)}" fill="${css("--muted")}" opacity="${r.suff === "충분" ? 1 : .35}" rx="1.5"/>`; });
  if (refS) s += `<polyline fill="none" stroke="${css("--ink")}" stroke-width="2" points="${refS.map((v, i) => `${left + i * bw + bw / 2},${y(v)}`).join(" ")}"/>` + refS.map((v, i) => `<circle cx="${left + i * bw + bw / 2}" cy="${y(v)}" r="2.5" fill="${css("--ink")}"/>`).join("");
  for (let i = 0; i < 12; i++) s += `<text x="${left + i * bw + bw / 2}" y="${h - 6}" text-anchor="middle" class="${i + 1 === M ? "lbl" : ""}">${i + 1}</text>`;
  s += `<rect x="${left + (M - 1) * bw + 1}" y="${top - 8}" width="${bw - 2}" height="${h - top - bottom + 8}" fill="none" stroke="${css("--ember")}" stroke-width="1.5"/></svg>`;
  const rm = r.risk.map(m => m + "월").join("·");
  const from = r.risk_from === "시·군·구" ? "이 지역 자료로 계산" : `${r.ref.name} 자료에서 물려받음`;
  el("s-season", head("계절 속 위치", "월별 비중 %") +
    `<p class="answer">위험 시기는 <b>${rm}</b> (${from}). ${MONTH}은 ${r.risk.includes(M) ? "위험 시기 안이에요." : "위험 시기 밖이에요."}</p>` + s +
    `<div class="legend"><span><i class="sw" style="background:${css("--ember-soft")}"></i>위험 시기</span>${tot > 0 ? `<span><i class="sw" style="background:${css("--muted")};opacity:${r.suff === "충분" ? 1 : .35}"></i>이 지역</span>` : ""}${refS ? `<span>━ ${refName}</span>` : ""}</div>` +
    design(r.suff === "충분" ? "충분: 이 지역 막대만" : "부족·감지 없음: 이 지역은 흐리게, 물려받은 기준을 선으로. 출처를 문장에 밝힘"));
}

function map(r) {
  const all = [r.geom, ...r.neighbors.map(n => n.geom)].flat(3);
  const xs = all.map(p => p[0]), ys = all.map(p => p[1]);
  const lat0 = r.center[1], kx = Math.cos(lat0 * Math.PI / 180);
  const minx = Math.min(...xs), maxx = Math.max(...xs), miny = Math.min(...ys), maxy = Math.max(...ys);
  const W = 460, pad = 8, sc = (W - 2 * pad) / ((maxx - minx) * kx), H = Math.round((maxy - miny) * sc + 2 * pad);
  const P = ([x, y]) => [pad + (x - minx) * kx * sc, pad + (maxy - y) * sc];
  const path = g => g.map(poly => poly.map(ring => "M" + ring.map(p => P(p).map(v => v.toFixed(1)).join(",")).join("L") + "Z").join("")).join("");
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img">`;
  r.neighbors.forEach(n => s += `<path d="${path(n.geom)}" fill="${css("--faint")}" stroke="${css("--line")}"/>`);
  s += `<path d="${path(r.geom)}" fill="${css("--surface")}" stroke="${css("--ink")}" stroke-width="1.5"/>`;
  const cell = 0.02 * sc;
  r.rec.forEach(c => { const [x, y] = P([c.lon, c.lat]); s += `<rect x="${x - cell * kx / 2}" y="${y - cell / 2}" width="${cell * kx}" height="${cell}" fill="${css("--band")}" opacity="${0.5 + Math.min(c.y, 5) / 10}"/>`; });
  const d0 = Math.min(...r.points.map(q => q[2])), dc = d => d - d0 <= 0 ? css("--d1") : d - d0 === 1 ? css("--d2") : d - d0 === 2 ? css("--d3") : css("--d4");
  r.points.forEach(([x0, y0, d]) => { const [x, y] = P([x0, y0]); s += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.2" fill="${dc(d)}" stroke="${css("--surface")}" stroke-width=".4"/>`; });
  r.neighbors.forEach(n => { const ring = n.geom[0][0], cx = ring.reduce((a, p) => a + p[0], 0) / ring.length, cy = ring.reduce((a, p) => a + p[1], 0) / ring.length; const [x, y] = P([cx, cy]); s += `<text x="${x}" y="${y}" text-anchor="middle">${short(n.label)}</text>`; });
  const [mx, my] = P(r.center); s += `<text x="${mx}" y="${my}" text-anchor="middle" class="lbl">${short(r.label)}</text></svg>`;
  el("s-map", head("어디서 탔나", "이번 달 감지 + 재발 격자") +
    `<p class="answer">${r.points.length ? `이번 달 화재 칸 ${r.points.length}개. 회색 칸은 2012~2025년에 불이 잡힌 적 있는 약 2 km 격자예요.` : "이번 달 이 지역 안에서는 감지가 없어요. 주변 시·군·구 경계를 함께 보여 드려요."}</p>` + s +
    `<div class="legend">${r.points.length ? `<span>첫 감지 날부터: <i class="sw" style="background:${css("--d1")}"></i>첫날 <i class="sw" style="background:${css("--d2")}"></i>+1일 <i class="sw" style="background:${css("--d3")}"></i>+2일 <i class="sw" style="background:${css("--d4")}"></i>+3일~</span>` : ""}<span><i class="sw" style="background:${css("--band")}"></i>과거 감지 격자</span></div>` +
    design("감지 위치는 사실이라 자료 수준과 관계없이 항상 표시"));
}

function nb(r) {
  const rows = [...r.neighbors].sort((a, b) => b.v - a.v);
  const hot = rows.filter(n => n.v >= 10);
  el("s-nb", head("주변 지역", `맞닿은 ${rows.length}곳`) +
    `<p class="answer">${hot.length ? `<b>${hot.map(n => short(n.label)).join(", ")}</b>에서도 이번 달 감지가 많았어요.` : "맞닿은 지역에서 이번 달 큰 감지는 없었어요."} 순위는 자료가 충분하고 값이 0보다 큰 지역만 보여 드려요.</p>
    <div class="scroll"><table><thead><tr><th>지역</th><th>자료</th><th class="n">이번 달 화재 칸</th><th class="n">같은 달 순위</th></tr></thead><tbody>${rows.map(n => `<tr class="${n.v >= 10 ? "me" : ""}"><td>${short(n.label)}</td><td><span class="chip ${ST[n.suff][0]}">${ST[n.suff][1]}</span></td><td class="n">${fmt(n.v)}</td><td class="n">${n.suff === "충분" && n.v > 0 ? `${n.rank} / ${n.n}` : "—"}</td></tr>`).join("")}</tbody></table></div>` +
    design("모든 상태에서 같은 표. 감지 없음 지역에는 이 표가 핵심 정보"));
}

function memo(r) {
  const rows = [
    ["기간", "기록은 2001년부터 있어요. 전국 25년 기록은 산림청 공식 건수로 검증했어요 (2012년 단절: 보정 전 2.67배 → 보정 후 1.04배). 다만 시·군·구에서는 한 달·한 해 값이 위성마다 크게 어긋나서(MODIS↔VIIRS 오차 중앙값 " + Math.round(D.national.err_dist * 100) + "%), 같은 달 비교·순위·평년은 2012년 이후 VIIRS로만 계산해요. 2001~2011년은 검증을 통과한 25년 합계에만 써요."],
    ["단위", "모두 NOAA-20 단위예요. 2018년 4월부터는 NOAA-20 원값, 2012년 2월~2018년 3월은 S-NPP를, 그 이전은 MODIS를 NOAA-20 단위로 옮긴 값이에요."],
    ["화재 칸", "약 1 km 칸에서 그날 불이 1번 이상 잡히면 1칸. 같은 칸·같은 날의 여러 점은 하나로 셉니다. 해상도가 다른 위성끼리 같은 뜻이 되도록 하기 위해서예요. 넓이와 기간이 합쳐진 활동량이라, 화재 건수가 아니에요."],
    ["평년 비교", "같은 달 14년 값 중 가운데 절반을 '보통 해'로 봐요. 그보다 많으면 '평년보다 많음', 14년 중 최고면 '이례적으로 많음'."],
    ["자료 수준", `가장 많이 탄 해를 뺀 연평균 화재 칸 ${fmt(r.annual)}개 → <span class="chip ${ST[r.suff][0]}">${ST[r.suff][1]}</span> (기준 ${fmt(D.national.min_annual)}개: 해마다의 우연한 흔들림이 30% 이하가 되는 값)`],
  ];
  if (r.suff !== "충분" && r.annual_all >= D.national.min_annual) rows.push(["왜 부족인가", `단순 연평균은 ${fmt(r.annual_all)}칸이지만, 대부분이 한 해(${YEAR}년)에 몰려 있어요. 가장 많이 탄 해를 빼면 ${fmt(r.annual)}칸이라 평소 자료는 적은 지역이에요. 큰 사건 한 번으로 '충분'이 되지 않게 이렇게 판정해요.`]);
  if (r.suff !== "충분") rows.push(["대체 정보", `위험 시기와 계절 비교는 ${r.ref.name} 전체 값을 썼어요${r.ref.name !== r.prov.name ? ` (${r.prov.name}도 자료가 적어 가장 가까운 자료 충분 시·도로 대체)` : ""}. ${r.ref.name} 값은 ${r.ref.basis} 기준이에요 (센서 간 교차검증 오차 ${Math.round(r.ref.err * 100)}%).`]);
  rows.push(["출처", "NASA FIRMS VIIRS NOAA-20 (VJ114IMG)·S-NPP (VNP14IMG) 375 m, 산림청 산불 통계, 경계 geoBoundaries (CC BY 3.0)"]);
  el("s-memo", head("이 숫자를 읽는 법") + `<dl>${rows.map(([a, b]) => `<dt>${a}</dt><dd>${b}</dd>`).join("")}</dl>`);
}

function show(i) {
  cur = i; const r = D.regions[i];
  YEAR = +r.ym.slice(0, 4); M = +r.ym.slice(5); MONTH = M + "월";
  document.querySelectorAll("#picker button").forEach((b, j) => b.setAttribute("aria-pressed", j === i));
  hero(r); years(r); rank(r); daily(r); official(r); season(r); map(r); nb(r); memo(r);
  document.querySelectorAll("[data-go]").forEach(b => b.onclick = () => go(b.dataset.go, true));
}
function go(tok, scroll) { const i = D.regions.findIndex(r => TOK[r.id] === tok); if (i >= 0) { show(i); try { history.replaceState(null, "", "#" + tok); } catch (e) {} if (scroll) window.scrollTo({ top: 0 }); } }
document.getElementById("picker").innerHTML = D.regions.map((r, i) => `<button type="button" id="pick-${TOK[r.id]}" aria-pressed="false" data-tok="${TOK[r.id]}"><i class="dot" style="background:var(--${ST[r.suff][0]})"></i>${ko(r.label)} · ${r.ym.slice(0, 4)}년 ${+r.ym.slice(5)}월 · ${ST[r.suff][1]}</button>`).join("");
document.querySelectorAll("#picker button").forEach(b => b.onclick = () => go(b.dataset.tok));
const h0 = location.hash.slice(1);
show(Math.max(0, D.regions.findIndex(r => TOK[r.id] === h0)));
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", () => show(cur));
new MutationObserver(() => show(cur)).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
</script>
